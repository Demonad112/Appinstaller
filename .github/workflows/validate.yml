name: Validate installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dest_url:
        description: 'Destination URL for the shortcut (custom run)'
        required: false
        default: 'https://example.com/mom'
      shortcut_name:
        description: 'Shortcut / file name (custom run)'
        required: false
        default: 'Example Site'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tests/check-catalog.mjs

  # Drives the real configurator page in headless Chromium for every fixture and asserts the
  # downloaded .cmd == the Node render == tests/golden.json.
  browser:
    needs: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs

  scenario:
    needs: catalog
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per tests/fixtures/<name>.json (enforced by tests/check-catalog.mjs).
        scenario:
          - default
          - chrome-present
          - chrome-fresh
          - chrome-blocked
          - default-icon
          - machine-scope
          - run-lock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run scenario
        shell: pwsh
        run: ./tests/Run-Scenario.ps1 -Fixture "tests/fixtures/${{ matrix.scenario }}.json"
      - name: Upload rendered artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rendered-${{ matrix.scenario }}
          path: out/

  # On-demand real trial with user-supplied values. Inputs reach the script only as env var
  # data, never spliced into shell text via ${{ }} (that is how CI script injection happens).
  custom:
    if: github.event_name == 'workflow_dispatch'
    needs: catalog
    runs-on: windows-latest
    env:
      SHORTCUT_NAME: ${{ github.event.inputs.shortcut_name }}
      DEST_URL: ${{ github.event.inputs.dest_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build fixture from inputs
        shell: pwsh
        run: |
          $config = [ordered]@{
            modules = [ordered]@{
              'chrome' = [ordered]@{}
              'desktop-shortcut' = [ordered]@{ destUrl = $env:DEST_URL; name = $env:SHORTCUT_NAME; style = 'App' }
              'ublock-lite' = [ordered]@{ pinToolbar = $true; autoRestartChrome = $false }
            }
            generateUninstall = $true
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path custom-fixture.json
          Get-Content custom-fixture.json | Write-Host
      - name: Run scenario
        shell: pwsh
        run: ./tests/Run-Scenario.ps1 -Fixture custom-fixture.json
      - name: Upload rendered artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rendered-custom
          path: out/
